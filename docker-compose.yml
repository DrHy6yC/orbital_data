services:
  postgres:
    image: postgres:17.12
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  s3:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_RUSTFS_ACCESS_KEY:?задайте S3_RUSTFS_ACCESS_KEY в .env}
      RUSTFS_SECRET_KEY: ${S3_RUSTFS_SECRET_KEY:?задайте S3_RUSTFS_SECRET_KEY в .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${S3_RUSTFS_PORT:?задайте S3_RUSTFS_PORT в .env}:9000"
      - "127.0.0.1:${S3_RUSTFS_CONSOLE_PORT:?задайте S3_RUSTFS_CONSOLE_PORT в .env}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  s3-data: