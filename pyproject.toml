[project]
name = "orbital-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
